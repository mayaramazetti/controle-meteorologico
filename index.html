
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b172a">
  <title>Coleta de Dados Meteorológicos</title>

  <style>
    :root {
      --bg: #0b172a;
      --panel: rgba(17, 31, 54, .88);
      --line: rgba(173, 195, 226, .18);
      --text: #f4f7fb;
      --muted: #aab8cc;
      --accent: #55c2e8;
      --accent-dark: #143e59;
      --ok: #65d6a2;
      --error: #ff8d8d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(46,139,181,.22), transparent 34%),
        radial-gradient(circle at 90% 85%, rgba(70,105,170,.2), transparent 32%),
        var(--bg);
    }

    .wrap {
      width: 100%;
      max-width: 560px;
    }

    .eyebrow {
      color: #9bdcf2;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .card {
      margin-top: 14px;
      padding: clamp(24px, 5vw, 38px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
      backdrop-filter: blur(14px);
    }

    .icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: rgba(85,194,232,.13);
      font-size: 27px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 5vw, 2.1rem);
      letter-spacing: -.04em;
    }

    .intro {
      color: var(--muted);
      line-height: 1.6;
      margin: 10px 0 28px;
    }

    .field {
      margin: 20px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: .91rem;
      font-weight: 650;
    }

    .required {
      color: var(--accent);
    }

    input {
      width: 100%;
      min-height: 50px;
      padding: 13px 14px;
      color: var(--text);
      background: rgba(5,15,30,.58);
      border: 1px solid var(--line);
      border-radius: 11px;
      font: inherit;
      outline: none;
      transition: .2s;
    }

    input::placeholder {
      color: #71829a;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(85,194,232,.13);
    }

    .hint {
      color: var(--muted);
      font-size: .78rem;
      margin: 7px 0 0;
    }

    .location-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 47px;
      margin: 5px 0 22px;
      color: #c9effa;
      background: var(--accent-dark);
      border: 1px solid rgba(85,194,232,.28);
      border-radius: 11px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.12);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .submit {
      width: 100%;
      min-height: 52px;
      margin-top: 8px;
      color: #071827;
      background: linear-gradient(110deg, #75d7ef, #55c2e8);
      border: 0;
      border-radius: 11px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .status {
      min-height: 22px;
      margin: 16px 0 0;
      font-size: .88rem;
      line-height: 1.5;
    }

    .status.success {
      color: var(--ok);
    }

    .status.error {
      color: var(--error);
    }

    .footer {
      color: #71829a;
      font-size: .76rem;
      text-align: center;
      margin: 18px 8px 0;
    }

    @media (max-width: 420px) {
      body {
        padding: 18px 12px;
      }

      .card {
        border-radius: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="wrap">

    <div class="eyebrow">Formulário de coleta</div>

    <section class="card">

      <div class="icon">🌦️</div>

      <h1>Dados meteorológicos</h1>

      <p class="intro">
        Informe o local e suas coordenadas geográficas
        para registrar a coleta.
      </p>

      <form
        id="weatherForm"
        action="https://docs.google.com/forms/d/e/1FAIpQLScxXaIxFQjUrjGkDrvjQgIxymR7BdeiastMG3b7RakJaYdXjA/formResponse"
        method="POST"
        target="googleFormFrame"
      >

        <div class="field">
          <label for="local">
            Nome do local <span class="required">*</span>
          </label>

          <input
            id="local"
            name="entry.1059568042"
            type="text"
            placeholder="Ex.: Campinas, SP"
            required
            maxlength="200"
          >
        </div>

        <button
          class="location-btn"
          id="geoButton"
          type="button"
        >
          ◎ Usar minha localização
        </button>

        <div class="field">
          <label for="latitude">
            Latitude <span class="required">*</span>
          </label>

          <input
            id="latitude"
            name="entry.1930279681"
            type="number"
            step="any"
            min="-90"
            max="90"
            placeholder="Ex.: -22.9056"
            required
          >

          <p class="hint">Valor entre -90 e 90.</p>
        </div>

        <div class="field">
          <label for="longitude">
            Longitude <span class="required">*</span>
          </label>

          <input
            id="longitude"
            name="entry.1128105295"
            type="number"
            step="any"
            min="-180"
            max="180"
            placeholder="Ex.: -47.0608"
            required
          >

          <p class="hint">Valor entre -180 e 180.</p>
        </div>

        <button
          class="submit"
          id="submitButton"
          type="submit"
        >
          Enviar dados
        </button>

        <p
          class="status"
          id="status"
          role="status"
          aria-live="polite"
        ></p>

      </form>

      <iframe
        name="googleFormFrame"
        title="Envio do formulário"
        hidden
      ></iframe>

    </section>

    <p class="footer">
      Os dados serão enviados ao formulário de destino do Google Forms.
    </p>

  </main>

  <script>
    const form = document.getElementById('weatherForm');
    const geoButton = document.getElementById('geoButton');
    const submitButton = document.getElementById('submitButton');
    const status = document.getElementById('status');

    function showStatus(message, type = '') {
      status.textContent = message;
      status.className = `status ${type}`;
    }

    // Captura automática da localização
    geoButton.addEventListener('click', () => {

      if (!('geolocation' in navigator)) {
        showStatus(
          'Seu navegador não oferece suporte à geolocalização.',
          'error'
        );
        return;
      }

      geoButton.disabled = true;
      geoButton.textContent = 'Obtendo localização…';

      showStatus(
        'Permita o acesso à localização quando o navegador solicitar.'
      );

      navigator.geolocation.getCurrentPosition(

        ({ coords }) => {

          document.getElementById('latitude').value =
            coords.latitude.toFixed(6);

          document.getElementById('longitude').value =
            coords.longitude.toFixed(6);

          geoButton.disabled = false;

          geoButton.innerHTML =
            '✓ Localização preenchida';

          showStatus(
            'Coordenadas preenchidas. Confira o nome do local antes de enviar.',
            'success'
          );
        },

        (error) => {

          const messages = {
            1: 'Permissão de localização negada. Preencha manualmente.',
            2: 'Não foi possível determinar sua localização.',
            3: 'A solicitação demorou demais. Tente novamente.'
          };

          showStatus(
            messages[error.code] ||
            'Não foi possível obter a localização.',
            'error'
          );

          geoButton.disabled = false;
          geoButton.innerHTML = '◎ Tentar novamente';
        },

        {
          enableHighAccuracy: true,
          timeout: 12000,
          maximumAge: 60000
        }

      );
    });

    // Envio para o Google Forms
    form.addEventListener('submit', () => {

      submitButton.disabled = true;
      submitButton.textContent = 'Enviando…';

      showStatus('Enviando os dados ao Google Forms…');

      // O navegador não permite ler diretamente a resposta
      // do Google Forms por ser outro domínio.
      window.setTimeout(() => {

        submitButton.disabled = false;
        submitButton.textContent = 'Enviar dados';

        showStatus(
          'Envio realizado. Verifique as respostas no Google Forms para confirmar o registro.',
          'success'
        );

        form.reset();

        geoButton.disabled = false;
        geoButton.innerHTML = '◎ Usar minha localização';

      }, 1800);

    });

  </script>

</body>
</html>
